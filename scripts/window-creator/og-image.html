     Regenerate with:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=2 --window-size=1200,630 \
         --screenshot=og@2x.png file://$PWD/og-image.html
       sips -z 630 1200 og@2x.png --out og-image.png
     Fonts are macOS system fonts (Bodoni 72, Andale Mono). -->
<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --cream:#F3F0E6;
    --sand:#C3B183;
    --deep:#1D3A5C;
    --ochre:#C0843A;
    --slate:#2C5551;
    --ink:#15151E;
    --gold:#D9B56A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"Bodoni 72",Didot,serif;background:#C3B183}

  /* ---- background bands ---- */
  .band{position:absolute;left:430px;right:0}
  .b1{top:0;height:300px;background:#1D3A5C}
  .b2{top:300px;height:72px;background:#C0843A}
  .b3{top:372px;height:148px;background:#2C5551}
  .b4{top:520px;height:110px;background:#15151E}
  .rule-v{position:absolute;left:392px;top:0;width:1px;height:630px;background:rgba(0,0,0,.16)}

  /* ---- motif: floating window glyphs ---- */
  .glyph{position:absolute;border:2px solid currentColor;border-radius:4px;opacity:.5}
  .glyph::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;
    border-bottom:2px solid currentColor}
  .glyph::after{content:"";position:absolute;left:3px;top:1.5px;width:2px;height:2px;
    border-radius:50%;background:currentColor;box-shadow:4px 0 0 currentColor,8px 0 0 currentColor}

  .g1{color:#0f2942;left:560px;top:44px;width:26px;height:20px}
  .g2{color:#8a5b24;left:1040px;top:322px;width:30px;height:23px}
  .g3{color:#3a3a46;left:1112px;top:556px;width:24px;height:18px}
  .g4{color:#a9985f;left:120px;top:44px;width:24px;height:18px}

  /* big window motif, top right — the "sun" of the original */
  .motif{position:absolute;right:56px;top:74px;width:168px;height:126px;
    border:3px solid #D9B56A;border-radius:10px;opacity:.85}
  .motif .bar{position:absolute;left:0;right:0;top:0;height:26px;
    border-bottom:3px solid #D9B56A;background:rgba(217,181,106,.14)}
  .motif .dot{position:absolute;top:9px;width:8px;height:8px;border-radius:50%;background:#D9B56A}

  /* ---- right-hand text ---- */
  .copy{position:absolute;left:534px;top:0;width:640px;height:630px}
  h1{font-weight:700;font-size:96px;line-height:.92;color:#F3F0E6;
     letter-spacing:-.01em;position:absolute;top:84px}
  .kicker{position:absolute;top:312px;font-family:"Andale Mono",Menlo,monospace;
     font-size:17px;letter-spacing:.34em;color:#E8C77E;font-weight:700}
  .hr{position:absolute;top:356px;width:438px;height:2px;background:#C9A24F}
  h2{position:absolute;top:396px;font-weight:700;font-size:31px;color:#F3F0E6}
  p{position:absolute;top:448px;width:590px;font-size:22px;line-height:1.42;
     color:#EDE8DA}

  /* ---- device card ---- */
  .card{position:absolute;left:86px;top:108px;width:388px;height:414px;
    background:#F3F0E6;border-radius:30px;padding:15px;
    box-shadow:0 26px 54px rgba(0,0,0,.34), 0 4px 10px rgba(0,0,0,.18)}
  .screen{width:100%;height:100%;border:1px solid #23232a;display:flex;flex-direction:column}
  .strip{display:flex;justify-content:space-between;align-items:center;
    font-family:"Andale Mono",Menlo,monospace;font-size:6.5px;letter-spacing:.16em;
    color:#23232a;padding:5px 7px}
  .canvas{flex:1;margin:0 7px;background:#E7E3D6;position:relative;overflow:hidden;
    border:1px solid #23232a}
  .foot{padding:6px 7px 2px}
  .foot .t{font-weight:700;font-size:12.5px;letter-spacing:.13em;color:#23232a}
  .foot .m{display:flex;justify-content:space-between;align-items:center;
    font-family:"Andale Mono",Menlo,monospace;font-size:6px;letter-spacing:.13em;
    color:#4a4a52;margin-top:3px}
  .swatch{width:7px;height:7px;background:#C0843A}

  /* ---- mini windows on the canvas ---- */
  .w{position:absolute;box-shadow:0 5px 12px rgba(0,0,0,.3)}

  /* macOS Big Sur, light */
  .mac{left:16px;top:22px;width:186px;height:104px;border-radius:7px;background:#FBFBFC;
    border:1px solid #cfcfd4;overflow:hidden}
  .mac .tb{height:19px;background:#ECECEE;border-bottom:1px solid #d8d8dc;position:relative}
  .mac .tl{position:absolute;top:6.5px;width:7px;height:7px;border-radius:50%}

  /* Windows XP Luna */
  .xp{left:132px;top:100px;width:170px;height:92px;border-radius:5px 5px 0 0;
    background:#ECE9D8;border:3px solid #0A56C8;border-top:none;overflow:hidden}
  .xp .tb{height:17px;border-radius:2px 2px 0 0;position:relative;
    background:linear-gradient(180deg,#3F8CE8 0%,#1A5FD0 42%,#1250C4 78%,#0A46B4 100%)}
  .xp .btn{position:absolute;top:3px;width:11px;height:11px;border-radius:2px;
    background:#3C7FE0;border:1px solid #9CC3F0}
  .xp .close{background:#D94A32;border-color:#F0A99C}

  /* GNOME Adwaita, dark */
  .gn{left:44px;top:196px;width:196px;height:100px;border-radius:9px;background:#1E1E1E;
    border:1px solid #0d0d0d;overflow:hidden}
  .gn .tb{height:26px;background:#3B3B3B;border-bottom:1px solid #151515;position:relative}
  .gn .x{position:absolute;right:7px;top:7px;width:12px;height:12px;border-radius:50%;
    background:#5C5C5C;border:1px solid #6e6e6e}
  .gn .pill{position:absolute;left:50%;transform:translateX(-50%);top:10px;
    width:54px;height:6px;border-radius:3px;background:#787878}

  /* affinity-ish selection handles on the GNOME window */
  .h{position:absolute;width:6px;height:6px;background:#F3F0E6;border:1px solid #1f6f4a}
  .h.on{background:#2E9E68}
</style>

<div class="band b2"></div>
<div class="band b3"></div>
<div class="band b4"></div>

<div class="glyph g3"></div>
<div class="glyph g4"></div>

<div class="motif">
  <div class="bar"></div>
  <div class="dot" style="left:10px"></div>
  <div class="dot" style="left:24px"></div>
  <div class="dot" style="left:38px"></div>
</div>

<div class="copy">
  <h1>Window<br>Chrome</h1>
  <div class="kicker">EIGHT DESKTOP STYLES</div>
  <div class="hr"></div>
  <h2>Affinity Script</h2>
  <p>Turns any rectangle into empty window chrome — eight desktop<br>
     interfaces, at their real measurements, as editable shapes.</p>
</div>

          <div class="btn close" style="right:5px"></div>

      <div class="w gn">

      <div class="h on" style="left:41px;top:193px"></div>
      <div class="h"    style="left:137px;top:193px"></div>
      <div class="h"    style="left:233px;top:193px"></div>
      <div class="h"    style="left:41px;top:243px"></div>
      <div class="h"    style="left:233px;top:243px"></div>
      <div class="h"    style="left:41px;top:293px"></div>
      <div class="h"    style="left:137px;top:293px"></div>
      <div class="h"    style="left:233px;top:293px"></div>
    </div>
    <div class="foot">
      <div class="t">WINDOW CHROME</div>
      <div class="m"><span>MACOS / WINDOWS / LINUX &nbsp;·&nbsp; LIGHT &amp; DARK &nbsp;·&nbsp; EDITABLE CURVES</span><span class="swatch"></span></div>
    </div>
  </div>
</div>
